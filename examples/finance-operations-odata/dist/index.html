<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F&O OData Sample</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 32px; max-width: 1000px; }
    h1 { font-size: 24px; } p { line-height: 1.5; }
    .actions { display: flex; gap: 12px; margin: 20px 0; }
    input, button { font: inherit; padding: 10px 12px; border: 1px solid #888; border-radius: 4px; }
    input { width: 100%; box-sizing: border-box; margin: 8px 0; }
    button { cursor: pointer; } button:disabled { cursor: wait; opacity: .6; }
    pre { border: 1px solid #888; padding: 16px; overflow: auto; max-height: 55vh; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Finance &amp; Operations OData</h1>
  <p id="connection">Loading selected connection…</p>
  <p>This sample only reads data. Discover an entity set, then query it using its public collection name.</p>
  <div class="actions">
    <button id="discover">List entity sets</button>
    <button id="metadata">Read metadata</button>
  </div>
  <label for="query">OData path relative to /data (or a returned next link)</label>
  <input id="query" value="CustomersV3?$top=5" spellcheck="false">
  <div class="actions">
    <button id="run">Run query</button>
    <button id="next" disabled>Next page</button>
  </div>
  <p id="status" role="status" aria-live="polite">Ready</p>
  <pre id="result">Choose an action to test the API.</pre>
  <script src="sample.js"></script>
</body>
</html>
